<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Scelta Academia • NorteX Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="bg"></div>

<div class="wrapper">

  <div class="panel">

    <img
      class="logo"
      src="https://i.imgur.com/WR5YqZQ.png"
    >

    <div class="eyebrow">
      Área Executiva
    </div>

    <h1 class="title">
      Scelta Academia
    </h1>

    <p class="subtitle">
      Material estratégico desenvolvido para apresentação e alinhamento executivo.
    </p>

    <!-- LINKS -->

    <div class="links disabled" id="links">

      <a href="./diagnostico/index.html">
        Diagnóstico Estratégico
      </a>

      <a href="./proposta/index.html">
        Proposta Executiva
      </a>

    </div>

    <!-- PIN -->

    <div class="pin-area">

      <div class="pin-label">
        Digite o PIN de acesso
      </div>

      <input
        type="password"
        maxlength="4"
        id="pin"
        placeholder="••••"
      >

      <button id="unlock">
        Liberar acesso
      </button>

    </div>

    <div class="hint">
      Material confidencial • NorteX Digital
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
